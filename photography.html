<script>
// Photos in photography_urban/. Add or remove a file name here when the folder changes.
const photos = [
"100_0405.JPG",
"6375CB4D-5103-4B2A-869A-E1281467A505.JPG",
"IMG_0017.JPG",
"IMG_0039.JPG",
"IMG_0042.JPG",
"IMG_0077.JPG",
"IMG_0130.jpg",
"IMG_0132.jpg",
"IMG_0162 (1).JPG",
"IMG_0201.JPG",
"IMG_0221.JPG",
"IMG_0344.JPG",
"IMG_0462.JPG",
"IMG_0467.JPG",
"IMG_0468.JPG",
"IMG_1384.JPG",
"IMG_1388.JPG",
"IMG_1406.JPG",
"IMG_1515.JPG",
"IMG_1599.JPG",
"IMG_1600.JPG",
"IMG_1831.JPG",
"IMG_2770.JPG",
"IMG_2888.JPG",
"IMG_2889.JPG",
"IMG_2899.JPG",
"IMG_3376.jpg",
"IMG_3394.jpg"
];

const img = document.getElementById("photo");
const count = document.getElementById("count");
let index = 0;

function show(n) {
  index = (n + photos.length) % photos.length;
  img.src = "photography_urban/" + photos[index];
  img.alt = "Photo " + (index + 1) + " of " + photos.length;
  count.textContent = (index + 1) + " / " + photos.length;
  // Warm the browser cache for the next photo so switching feels instant.
  new Image().src = "photography_urban/" + photos[(index + 1) % photos.length];
}

document.getElementById("photo-link").addEventListener("click", () => show(index + 1));
document.getElementById("prev").addEventListener("click", () => show(index - 1));
document.getElementById("next").addEventListener("click", () => show(index + 1));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") show(index - 1);
  if (e.key === "ArrowRight") show(index + 1);
});

show(0);
</script>
